name: Generate BrainXperts Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate stable release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore brainxperts-release.jks \
            -storetype JKS \
            -alias brainxperts \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=BrainXperts, OU=Mobile, O=BrainXperts, L=Bangladesh, ST=Bangladesh, C=BD" \
            -noprompt

          base64 -w 0 brainxperts-release.jks > brainxperts-release.base64

      - name: Upload keystore file
        uses: actions/upload-artifact@v4
        with:
          name: BrainXperts-Stable-Keystore
          path: brainxperts-release.base64
