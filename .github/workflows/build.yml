name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Fix Manifest Package and Sync Firebase
        run: |
          # 1. Detect actual package name from google-services.json
          PKG_NAME=$(grep -o '"package_name": *"[^"]*"' android/app/google-services.json | head -1 | cut -d'"' -f4)
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.brainxperts.brainxperts"
          fi
          echo "Syncing package to: $PKG_NAME"

          # 2. Remove deprecated package attribute from all AndroidManifest.xml files
          find android/ -type f -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +

          # 3. Update applicationId and namespace in build.gradle
          find android/ -type f -name "build.gradle" -exec sed -i "s/applicationId .*/applicationId \"$PKG_NAME\"/g" {} +
          find android/ -type f -name "build.gradle" -exec sed -i "s/namespace .*/namespace \"$PKG_NAME\"/g" {} +
          find android/ -type f -name "build.gradle" -exec sed -i 's/minSdkVersion .*/minSdkVersion 23/g' {} +
          find android/ -type f -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/23/g' {} +

          # 4. Enable AndroidX
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BrainXperts-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
