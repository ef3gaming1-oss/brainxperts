name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Complete Android Rebuild & Fix Linking
        run: |
          # 1. google-services.json ফাইল ব্যাকআপ রাখা
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi

          # 2. আসল প্যাকেজ নেম বের করা
          PKG_NAME=""
          if [ -f "/tmp/google-services.json" ]; then
            PKG_NAME=$(grep -o '"package_name": *"[^"]*"' /tmp/google-services.json | head -1 | cut -d'"' -f4)
          fi
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.brainxperts.brainxperts"
          fi
          echo "Syncing with package: $PKG_NAME"

          # 3. ভাঙা বা অসম্পূর্ণ অ্যান্ড্রয়েড ফোল্ডার ক্লিন করে নতুন স্ট্যান্ডার্ড অ্যান্ড্রয়েড প্রজেক্ট তৈরি
          rm -rf android/
          flutter create . --platforms=android --org $(echo $PKG_NAME | rev | cut -d. -f2- | rev)

          # 4. google-services.json যথাস্থানে ফিরিয়ে আনা
          if [ -f "/tmp/google-services.json" ]; then
            mkdir -p android/app
            cp /tmp/google-services.json android/app/google-services.json
          fi

          # 5. MinSDK 23 এবং সঠিক Package ID সেট করা
          find android/ -type f -name "build.gradle" -exec sed -i "s/applicationId .*/applicationId \"$PKG_NAME\"/g" {} +
          find android/ -type f -name "build.gradle" -exec sed -i "s/namespace .*/namespace \"$PKG_NAME\"/g" {} +
          find android/ -type f -name "build.gradle" -exec sed -i 's/minSdkVersion .*/minSdkVersion 23/g' {} +
          find android/ -type f -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/23/g' {} +

          # 6. Google Services প্লাগিন যুক্ত করা
          sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.1" apply false' android/settings.gradle
          sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle

          # 7. AndroidX এনাবল করা
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BrainXperts-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
