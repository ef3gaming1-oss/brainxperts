name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Recreate Android project and configure Firebase
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi

          package_name=""
          if [ -f "/tmp/google-services.json" ]; then
            package_name=$(grep -o '"package_name"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/google-services.json | head -1 | cut -d'"' -f4 || true)
          fi
          if [ -z "$package_name" ]; then
            package_name="com.brainxperts.brainxperts"
          fi

          rm -rf android
          org_name=$(echo "$package_name" | rev | cut -d. -f2- | rev)
          flutter create . --platforms=android --org "$org_name"

          if [ -f "/tmp/google-services.json" ]; then
            mkdir -p android/app
            cp /tmp/google-services.json android/app/google-services.json
          fi

          find android -type f -name "build.gradle" -exec sed -i "s/applicationId .*/applicationId \"$package_name\"/g" {} +
          find android -type f -name "build.gradle" -exec sed -i "s/namespace .*/namespace \"$package_name\"/g" {} +
          find android -type f -name "build.gradle" -exec sed -i 's/minSdkVersion .*/minSdkVersion 23/g' {} +
          find android -type f -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/23/g' {} +

          sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.1" apply false' android/settings.gradle
          sed -i '/plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle

          grep -qxF "android.useAndroidX=true" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
          grep -qxF "android.enableJetifier=true" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Configure stable release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/brainxperts-release.jks

          printf '%s\n' \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyPassword=$KEYSTORE_PASSWORD" \
            "keyAlias=brainxperts" \
            "storeFile=brainxperts-release.jks" \
            > android/key.properties

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          prefix = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """

          if "def keystorePropertiesFile" not in text:
              text = prefix + text

          signing_block = """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """

          if "signingConfigs {" not in text:
              text = text.replace("android {", "android {\n" + signing_block, 1)

          build_types_index = text.find("buildTypes {")
          if build_types_index < 0:
              raise SystemExit("buildTypes block not found")

          release_index = text.find("release {", build_types_index)
          if release_index < 0:
              raise SystemExit("release build type not found")

          after_release = release_index + len("release {")
          if "signingConfig signingConfigs.release" not in text[after_release:after_release + 160]:
              text = text[:after_release] + "\n            signingConfig signingConfigs.release" + text[after_release:]

          text = text.replace("signingConfig = signingConfigs.debug", "signingConfig signingConfigs.release")
          path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Build test APK
        run: flutter build apk --debug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: BrainXperts-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build release APK
        run: flutter build apk --release

      - name: Extract stable SHA-1
        run: |
          echo "YOUR RELEASE APK SHA-1:"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep "SHA1:"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BrainXperts-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
